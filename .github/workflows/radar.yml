name: Radar settimanale

# La dashboard si aggiorna da sola il lunedi' mattina. Gira in cloud e non sul Mac di
# nessuno: launchd vuole la macchina sveglia e i permessi giusti, ed e' la ragione per
# cui il weekly di OFFER-LAB si e' fermato senza che nessuno se ne accorgesse.
on:
  schedule:
    - cron: "0 5 * * 1"        # lunedi' 05:00 UTC = 07:00 in Italia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
      RADAR_SITE: ${{ github.workspace }}
      TAG_META_TOKEN: ${{ secrets.TAG_META_TOKEN }}
      TAG_ADS_PASSWORD: ${{ secrets.TAG_ADS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet pillow
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -version | head -1

      - name: Raccolta dalla Ad Library
        working-directory: pipeline
        run: python tools/fetch.py --api --limit 300

      - name: Reach UE dichiarata da Meta
        working-directory: pipeline
        # tetto di spesa: la cache fa pagare solo le inserzioni mai viste prima
        run: python tools/enrich_reach.py --max 1500

      # I video PRIMA del build: build.py registra nel payload solo i video che trova
      # gia' sul disco. Invertendo l'ordine il payload esce senza video e la pulizia
      # del sito li cancella tutti. E' successo il 26/09/2026.
      - name: Video nuovi
        working-directory: pipeline
        run: python tools/fetch_videos.py --salta-se-in "$RADAR_SITE/v" --max 200

      - name: Immagini e pagina
        working-directory: pipeline
        run: python tools/build.py --media --media-max 8000

      - name: Costruisci il sito
        working-directory: pipeline
        run: python tools/build_site.py

      # Passo a parte: se il token manca o Meta non risponde, il radar si pubblica
      # lo stesso. Nel repo resta solo ads/index.html cifrato.
      - name: Top ads TAG
        working-directory: pipeline
        timeout-minutes: 150
        continue-on-error: true
        run: |
          if [ -z "$TAG_META_TOKEN" ] || [ -z "$TAG_ADS_PASSWORD" ]; then
            echo "Mancano TAG_META_TOKEN o TAG_ADS_PASSWORD: le ads non si aggiornano." >> "$GITHUB_STEP_SUMMARY"
            echo "mancano i secret delle ads" >&2
            exit 1
          fi
          python -m pip install --quiet 'cryptography>=42' pillow
          python tools/tag_ads.py && python tools/protect.py ads

      - name: Pubblica
        run: |
          git config user.name  "Radar NAM"
          git config user.email "abbonamenti@namstudio.it"
          rm -rf ads/.media
          rm -f ads/data.json ads/data.js ads/.data.json.partial ads/.index.html.tmp
          find ads -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.gif' -o -name '*.mp4' -o -name '*.mov' -o -name '*.webm' \) -delete
          if [ -f ads/index.html ] && grep -q -e 'window.TAG_DATA' -e 'data:image/' ads/index.html; then
            echo "ads/index.html è in chiaro, lo tolgo e non lo pubblico" >&2
            git checkout -- ads/index.html 2>/dev/null || rm -f ads/index.html
            if [ -f ads/index.html ] && grep -q -e 'window.TAG_DATA' -e 'data:image/' ads/index.html; then
              echo "non sono riuscito a togliere la pagina in chiaro" >&2
              exit 1
            fi
            echo "- Top ads non pubblicate: la pagina era in chiaro" >> "$GITHUB_STEP_SUMMARY"
          fi
          git add -A
          if git diff --staged --name-only | grep -E '^ads/' | grep -Eq '(^|/)(data\.json|data\.js|\.data\.json\.partial|\.index\.html\.tmp)$|\.media/|\.(png|jpe?g|webp|gif|mp4|mov|webm)$'; then
            echo "rifiuto il commit: dati ads in chiaro" >&2
            exit 1
          fi
          if git diff --staged --quiet; then
            echo "niente di nuovo questa settimana" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -q -m "Radar: raccolta del $(date +%d/%m/%Y)"
            git push
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = [json.loads(l) for l in open("pipeline/data/catalog.jsonl")]
          print(f"### Radar aggiornato\n")
          print(f"- {len(r)} inserzioni in catalogo")
          print(f"- {sum(1 for x in r if x.get('attiva_ora'))} ancora in aria")
          print(f"- {len({x['competitor'] for x in r})} inserzionisti")
          PY
          fi
